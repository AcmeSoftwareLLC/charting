name: acme_chart
description: A financial charting library for Flutter applications, offering a comprehensive suite of features for technical analysis and trading visualization.
version: 1.0.5

homepage: https://acmesoftware.com
repository: https://github.com/AcmeSoftwareLLC/charting/tree/main/packages/acme_chart

topics:
  - chart
  - candlestick
  - finance
  - trading
  - technical-analysis

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  acme_indicators: ^1.0.1
  collection: ^1.19.1
  equatable: ^2.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.1.1
  meta: ">=1.15.0 <2.0.0"
  provider: ^6.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.16
  json_serializable: ^6.14.1

flutter:
  fonts:
    - family: QuillIcons
      fonts:
        - asset: assets/fonts/quill_icons.ttf

flutter_intl:
  main_locale: en
  enabled: true
  class_name: ChartLocalization
